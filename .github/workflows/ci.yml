name: Validate package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install terminal test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect util-linux
          expect -v
          script -q -e -c 'test -t 0 && test -t 1' /dev/null
      - name: Install root and module dependencies
        run: |
          npm ci --ignore-scripts
          for module in extensions/*; do
            (
              cd "$module"
              if test -f package-lock.json; then
                npm ci --ignore-scripts
              else
                npm install --ignore-scripts --package-lock=false
              fi
            )
          done
      - name: Validate source and package contents
        run: npm run check
      - name: Validate independently checked modules
        run: npm run check:modules
      - name: Validate installed tarball
        run: npm run check:packed
      - name: Check whitespace and generated-file drift
        run: |
          git diff --check
          git diff --exit-code
